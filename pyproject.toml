[build-system]
requires = ["setuptools>=75,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-custodian"
version = "0.1.0"
description = "A local security-posture custodian for Hermes and Linux hosts"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0.1,<7"]

[project.optional-dependencies]
tui = ["textual>=0.89,<7"]
test = ["pytest>=8.3,<10"]

[project.scripts]
custodian = "custodian.cli:main"

[tool.setuptools.packages.find]
include = ["custodian*"]

[tool.setuptools.data-files]
"share/hermes-custodian/dashboard" = ["dashboard/index.html", "dashboard/styles.css", "dashboard/app.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
