[build-system]
requires = ["setuptools>=75,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-custodian"
version = "0.1.1"
description = "Local security-posture monitoring for Hermes on Linux, macOS and Windows"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0.1,<7", "textual>=0.89,<7", "prompt-toolkit>=3.0.48,<4"]

[project.optional-dependencies]
tui = ["textual>=0.89,<7"]
test = ["pytest>=8.3,<10"]

[project.scripts]
warden = "custodian.cli:main"
custodian = "custodian.cli:main"

[tool.setuptools.packages.find]
include = ["custodian*"]

[tool.setuptools.data-files]
"share/hermes-custodian/dashboard" = ["dashboard/index.html", "dashboard/styles.css", "dashboard/app.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
