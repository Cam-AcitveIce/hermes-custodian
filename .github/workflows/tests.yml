name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install isolated project dependencies
        run: python -m pip install -e ".[tui,test]"
      - name: Select owned Windows scratch ancestry
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $scratch = Join-Path $env:LOCALAPPDATA ('custodian-ci-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $scratch | Out-Null
          "TMPDIR=$scratch" >> $env:GITHUB_ENV
          "TEMP=$scratch" >> $env:GITHUB_ENV
          "TMP=$scratch" >> $env:GITHUB_ENV
      - name: Run fixture-only tests
        env:
          TMPDIR: ${{ env.TMPDIR || runner.temp }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m pytest tests -q --tb=short -p no:cacheprovider
