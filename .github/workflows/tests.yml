name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install isolated project dependencies
        run: python -m pip install -e '.[tui,test]'
      - name: Run fixture-only tests
        env:
          TMPDIR: ${{ runner.temp }}
        run: python -m pytest tests -q
